<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 28px 'Pretendard', 'Noto Sans KR', Arial, sans-serif; fill: #e2e8f0; }
      .subtitle { font: 500 13px 'Pretendard', 'Noto Sans KR', Arial, sans-serif; fill: #94a3b8; }
      .box-title { font: 700 15px 'Pretendard', 'Noto Sans KR', Arial, sans-serif; fill: #f8fafc; }
      .box-sub { font: 500 11px 'Pretendard', 'Noto Sans KR', Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 11px 'Pretendard', 'Noto Sans KR', Arial, sans-serif; fill: #e2e8f0; }
      .tiny { font: 500 10px 'Pretendard', 'Noto Sans KR', Arial, sans-serif; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1280" height="760" fill="#020617"/>
  <rect width="1280" height="760" fill="url(#grid)" opacity="0.65"/>

  <text x="52" y="58" class="title">질문 처리 시퀀스</text>
