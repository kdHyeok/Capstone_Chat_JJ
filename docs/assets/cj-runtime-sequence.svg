  <rect x="70" y="690" width="1120" height="36" rx="10" fill="rgba(15,23,42,0.75)" stroke="#334155"/>
  <text x="90" y="713" class="tiny">로그인 사용자 정보는 후속 응답 단계에서 참고 정보로 전달될 수 있다.</text>
